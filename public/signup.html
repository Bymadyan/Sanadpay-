<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب - SanadPay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>💳 SanadPay</h1>
      <nav>
        <a href="/">الرئيسية</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-container">
      <div class="auth-card card">
        <h2>إنشاء حساب</h2>

        <form id="signupForm">
          <div class="form-group">
            <label for="business_name">اسم العمل</label>
            <input type="text" id="business_name" name="business_name" required>
          </div>

          <div class="form-group">
            <label for="owner_name">اسم المالك</label>
            <input type="text" id="owner_name" name="owner_name" required>
          </div>

          <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="password">كلمة المرور</label>
            <input type="password" id="password" name="password" required>
            <small style="color: var(--text-muted);">6 أحرف على الأقل</small>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">إنشاء الحساب</button>
        </form>

        <p>لديك حساب بالفعل؟ <a href="/login">دخول</a></p>

        <div id="errorMsg" style="color: var(--danger); margin-top: 1rem; display: none;"></div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const business_name = document.getElementById('business_name').value;
      const owner_name = document.getElementById('owner_name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        const res = await fetch('/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ business_name, owner_name, email, password })
        });

        const data = await res.json();

        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          errorMsg.textContent = data.error || 'خطأ في إنشاء الحساب';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'خطأ في الاتصال بالخادم';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
